name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - 'go.mod'
          - 'stable'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # setup-go rejects the literal "go.mod" as a version: route it through
          # go-version-file, and pass every other matrix value as a version.
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}

      # Regenerates the filtered spec from Trakt's live OpenAPI document and the
      # Go client from it; fails when the committed output is stale.
      - name: Check generated Trakt client
        run: |
          make generate SPEC_IN="$RUNNER_TEMP/trakt-openapi.json"
          git diff --exit-code internal/trakt

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Test
        run: make coverage

      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./cover.out
          flags: unittests
          verbose: true
        if: matrix.go == 'stable'
